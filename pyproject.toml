[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ep_spikes"
version = "0.1.0"
description = "PJM day-ahead electricity price spike forecasting MVP"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "pyarrow>=14",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "holidays>=0.50",
    "gridstatus>=0.30",
    "requests>=2.31",
]

[project.optional-dependencies]
dl = ["torch>=2.1"]
dev = ["pytest>=8", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
