data:
  start_date: 2019-01-01
  end_date: 2024-12-31
  nodes: [COMED, PECO]
  weather_sites:
    COMED: {lat: 41.8781, lon: -87.6298, name: chicago}
    PECO:  {lat: 39.9526, lon: -75.1652, name: philadelphia}
  pjm_tz: America/New_York
  forecast_origin_hour_local: 10
  storm_states: [ILLINOIS, OHIO, INDIANA, MICHIGAN, KENTUCKY, WEST VIRGINIA,
                 VIRGINIA, PENNSYLVANIA, NEW JERSEY, DELAWARE, MARYLAND,
                 DISTRICT OF COLUMBIA, NORTH CAROLINA, TENNESSEE]

labels:
  absolute_threshold: 300.0
  seasonal_quantile: 0.95
  season_map:
    summer: [6, 7, 8]
    winter: [12, 1, 2]
    shoulder: [3, 4, 5, 9, 10, 11]

features:
  price_lags_hours: [24, 48, 168]
  price_roll_windows_hours: [24, 168]
  load_lags_hours: [24, 48, 168]
  storm_windows_hours: [12, 24, 48]
  weather_hourly_vars:
    - temperature_2m
    - apparent_temperature
    - relative_humidity_2m
    - precipitation
    - wind_speed_10m
    - wind_gusts_10m
  include_weather_anomaly: true
  weather_forecast_proxy: realized_obs

models:
  logistic:
    C: 1.0
    penalty: l2
    max_iter: 2000
    class_weight: balanced
  xgb_spike:
    n_estimators_grid: [300, 600]
    max_depth_grid: [4, 6]
    learning_rate_grid: [0.05, 0.1]
    subsample: 0.9
    colsample_bytree: 0.8
    tree_method: hist
    eval_metric: aucpr
    seed: 290
  xgb_quantile:
    quantile_alpha: [0.95, 0.99]
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    tree_method: hist
    seed: 290
  cv_n_splits: 4
  extra_models: [lear, mlp]         # Phase 2 (LSTM available but skipped: +45 min runtime)
  lear:
    max_iter: 5000
    n_alphas: 25
    seed: 290
  mlp:
    hidden_layer_sizes: [128, 64]
    activation: relu
    alpha: 1.0e-4
    learning_rate_init: 1.0e-3
    max_iter: 80
    seed: 290
  lstm:
    seq_len: 24
    hidden_size: 32
    epochs: 6
    batch_size: 256
    learning_rate: 1.0e-3
    seed: 290

folds:
  - {train_start: 2019-01-01, train_end: 2021-12-31, test_year: 2022}
  - {train_start: 2020-01-01, train_end: 2022-12-31, test_year: 2023}
  - {train_start: 2021-01-01, train_end: 2023-12-31, test_year: 2024}

cvar:
  alpha: 0.95
  hedge_thresholds: [0.05, 0.1, 0.2, 0.3, 0.5]
  forward_price: 65.0

runtime:
  log_level: INFO
  cache: true
